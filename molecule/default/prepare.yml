---
- name: Prepare
  hosts: all

  tasks:
    # required for ansible.builtin.apt with cache_valid_time (first run)
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Include setup tasks
      ansible.builtin.include_role:
        name: goncalomb.web-conductor
        tasks_from: setup
